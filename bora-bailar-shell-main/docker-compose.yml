services:
  postgres:
    image: postgres:16-alpine
    container_name: borabailar-db
    environment:
      POSTGRES_USER: borabailar
      POSTGRES_PASSWORD: borabailar123
      POSTGRES_DB: borabailar
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
